<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechLab — guia visual de mecânica</title>
<link rel="stylesheet" href="/vendor/98/98.css">
<style>
:root{--face:#c0c0c0;--hi:#fff;--lo:#808080;--dk:#0a0a0a;--ink:#000;--muted:#4a4a4a;--accent:#000080;--panel:#fff;
 --raised:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px #dfdfdf;
 --sunken:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px #dfdfdf,inset 2px 2px var(--dk);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 Tahoma,Verdana,"Segoe UI",sans-serif;background:var(--face);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--face);box-shadow:0 1px 0 var(--lo),0 2px 0 var(--hi)}
.tbar{display:flex;align-items:center;gap:10px;padding:5px 10px;background:linear-gradient(90deg,#000080,#1084d0);color:#fff}
.tbar h1{font:bold 14px Tahoma,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar p{font-size:11px;opacity:.85;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;flex-wrap:wrap;padding:2px 4px;align-items:center;font:11px "Pixelated MS Sans Serif",Tahoma,sans-serif}
#crumb{font:11px "Pixelated MS Sans Serif",Tahoma,sans-serif;color:var(--muted);padding:2px 10px 4px}
button{font:11px "Pixelated MS Sans Serif",Tahoma,sans-serif;min-width:0;min-height:23px;padding:3px 10px;border:none;border-radius:0;background:var(--face);color:var(--ink);box-shadow:var(--raised);cursor:pointer;user-select:none;touch-action:manipulation}
button:hover{background:#cfcfcf}
button:active,button.on{box-shadow:var(--sunken);background:repeating-conic-gradient(var(--face) 0 25%,#fff 0 50%) 0 0/2px 2px;font-weight:bold}
button.hold{background:var(--accent);color:#fff;box-shadow:var(--sunken)}
.dd{position:relative}
.ddb{box-shadow:none;background:none;padding:3px 8px;font-weight:normal}
.ddb:hover{box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--hi);background:none}
.dd.open .ddb,.ddb.on{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo);background:none;font-weight:bold}
.menu{display:none;position:absolute;top:100%;left:0;min-width:240px;max-width:calc(100vw - 24px);background:var(--face);box-shadow:var(--raised);padding:3px;z-index:20;flex-direction:column}
.dd.open .menu{display:flex}
.menu button{text-align:left;box-shadow:none;background:none;white-space:nowrap;padding:4px 18px 4px 22px;font-weight:normal;position:relative}
.menu button:hover{background:var(--accent);color:#fff}
.menu button.on{font-weight:bold}.menu button.on::before{content:"✓";position:absolute;left:7px}
main{max-width:1060px;margin:0 auto;padding:12px 14px 40px}
.mod{display:none}.mod.show{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mod h2{font-size:20px;margin-bottom:2px}.lead{color:var(--muted);margin:2px 0 12px}
.card{background:var(--panel);box-shadow:var(--sunken);padding:10px;position:relative}
.card canvas{width:100%;display:block;touch-action:none}
.tools{display:flex;gap:4px;align-items:center;margin:6px 0 0;flex-wrap:wrap}
.tools .lbl{font-size:11px;color:var(--muted);margin:0 4px 0 8px}
.tools .hint{margin-left:auto;font-size:11px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 4px;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:2px;min-width:200px;flex:1}
.ctrl label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctrl label b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;flex-direction:column;gap:2px}
.seg>span{font-size:12px;color:var(--muted)}
.seg>div{display:flex;flex-wrap:wrap;gap:3px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px}
input[type=range]{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:12px}
.stat{background:var(--face);box-shadow:var(--raised);padding:6px 10px}
.stat span{display:block;font-size:11px;color:var(--muted)}.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.cap{margin-top:12px;padding:8px 12px;background:#ffffe1;border:1px solid #000;min-height:48px}
.explain{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.explain>div{background:var(--face);box-shadow:var(--raised);padding:3px 3px 10px}
.explain h3{font-size:12px;color:#fff;background:linear-gradient(90deg,#000080,#1084d0);padding:3px 8px;margin-bottom:8px}
.explain>div>*:not(h3){margin:0 10px 6px}
.explain ul{padding-left:18px}.explain li{margin:3px 0}
.f{font-family:"Courier New",Consolas,monospace;background:#fff;border:1px solid var(--lo);padding:0 4px;font-size:12px;white-space:nowrap}
#pager{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:6px 0 16px}
.tile{display:grid;grid-template-columns:34px 1fr;gap:0 8px;text-align:left;padding:8px;min-height:62px;align-items:center;font:12px Tahoma,sans-serif}
.tile i{font-style:normal;font-size:24px;grid-row:span 2;text-align:center}
.tile b{font-size:12px}.tile small{color:var(--muted);line-height:1.3}
.home h3{font-size:13px;margin:14px 0 4px;color:var(--accent)}
@media (max-width:640px){.tbar p{display:none}.ctrl{min-width:150px}}
</style>
</head>
<body>
<header>
  <div class="tbar"><h1>⚙️ MechLab — guia visual de mecânica</h1><p>Arraste, mude os controles e use a câmera lenta (🐢) para ver cada detalhe.</p></div>
  <nav id="nav"></nav><div id="crumb"></div>
</header>
<main id="main"></main>
<script src="core.js"></script>
<script src="m-fundamentos.js"></script>
<script src="m-transmissao.js"></script>
<script src="m-mecanismos.js"></script>
<script src="m-veiculos.js"></script>
<script src="m-corte.js"></script>
<script src="m-agua.js"></script>
<script src="m-oleo.js"></script>
<script src="m-pneumatica.js"></script>
<script src="m-materiais.js"></script>
<script>MechLab.start();</script>
</body>
</html>
