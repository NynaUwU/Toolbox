<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinagem de conectores</title>
<link rel="stylesheet" href="/vendor/98/98.css"><link rel="stylesheet" href="/assets/tool98.css"><script src="/assets/table98.js" defer></script>
<style>
  body { display: flex; gap: 8px; height: 100%; }
  .list { width: 230px; flex: none; display: flex; flex-direction: column; gap: 6px; }
  .list input { width: 100%; }
  #list { flex: 1; overflow: auto; background: #fff; padding: 2px; }
  #list h4 { margin: 6px 4px 2px; font-size: 11px; color: #808080; text-transform: uppercase; }
  #list a { display: block; padding: 3px 6px; color: #000; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list a:hover { background: #dcdcf0; }
  #list a.active { background: #000080; color: #fff; }
  .main { flex: 1; min-width: 0; overflow: auto; }
  #title { font-size: 15px; margin: 0 0 2px; }
  .draw { background: #fff; padding: 10px; margin: 8px 0; }
  .draw svg { display: block; width: 100%; max-width: 640px; max-height: 300px; margin: 0 auto; }
  .pin { cursor: pointer; }
  .pin text { font: bold 10px Tahoma, Arial, sans-serif; pointer-events: none; }
  .pin.sel circle, .pin.sel rect { stroke: #ff00ff; stroke-width: 4; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; vertical-align: -2px; margin-right: 4px; }
  #pins td:first-child { font-weight: bold; font-family: "Courier New", monospace; white-space: nowrap; }
  #pins td:nth-child(2) { white-space: nowrap; }
  .wire { display: inline-block; width: 26px; height: 10px; border: 1px solid #000; vertical-align: middle; }
  .note { background: #ffffe1; border: 1px solid #000; padding: 6px 8px; margin-top: 8px; }
  @media (max-width: 640px) { body { flex-direction: column; } .list { width: auto; height: 200px; } }
</style>
</head><body>
<div class="list">
  <input id="q" type="text" placeholder="Buscar conector ou sinal…" aria-label="Buscar">
  <div id="list" class="sunken-panel"></div>
</div>
<div class="main">
  <h1 id="title"></h1>
  <p id="desc"></p>
  <div class="draw sunken-panel"><div id="svg"></div></div>
  <p class="muted" id="view"></p>
  <div class="legend" id="legend"></div>
  <div class="sunken-panel" style="margin-top:8px">
    <table class="interactive" style="width:100%"><thead><tr><th>Pino</th><th>Sinal</th><th>Função</th><th>Fio</th></tr></thead><tbody id="pins"></tbody></table>
  </div>
  <div class="note" id="note" hidden></div>
  <p class="muted" style="margin-top:8px">⚠ Confira sempre a numeração gravada no próprio conector: fabricantes às vezes desenham a vista pelo lado oposto (espelhada).</p>
</div>

<script type="module">
import { CONNECTORS, CATEGORIES } from "./data.js";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KIND = { pwr: ["#d00000", "Alimentação"], gnd: ["#222", "Terra"], data: ["#1060e0", "Dados"], ctl: ["#0a8a0a", "Controle"],
  vid: ["#8a2be2", "Vídeo"], aud: ["#c07000", "Áudio"], sh: ["#888", "Blindagem"], nc: ["#ccc", "Não ligado"] };
let cur = null;

// ---------- Lista ----------
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const match = c => !q || [c.name, c.desc, ...c.pins.map(p => p[1])].join(" ").toLowerCase().includes(q);
  $("list").innerHTML = CATEGORIES.map(([id, label]) => {
    const list = CONNECTORS.filter(c => c.cat === id && match(c));
    return list.length ? `<h4>${label}</h4>` + list.map(c => `<a href="#${c.id}" class="${cur?.id === c.id ? "active" : ""}">${esc(c.name)}</a>`).join("") : "";
  }).join("") || '<p class="muted" style="padding:6px">Nada encontrado.</p>';
}

// ---------- Desenho ----------
const pinById = c => new Map(c.pins.map(p => [String(p[0]), p]));
function pinShape(x, y, p, square, r = 11) {
  const [id, , , kind, wire] = p;
  // usa a cor do fio quando existe padrão (fontes, USB, VGA); senão, a cor da função
  const fill = wire && !String(wire).startsWith("stripe:") ? wire : KIND[kind]?.[0] || "#999";
  const lum = (h => { const n = parseInt(h.slice(1).padEnd(6, h.slice(1)), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; })(fill.length === 4 ? "#" + [...fill.slice(1)].map(c => c + c).join("") : fill);
  const txt = lum < 150 ? "#fff" : "#000";
  const label = String(id).length > 3 ? String(id).replace(/^P\d-/, "") : id;
  const shape = square ? `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" fill="${fill}" stroke="#000"/>`
    : `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#000"/>`;
  return `<g class="pin" data-pin="${esc(id)}"><title>${esc(id)} — ${esc(p[1])}</title>${shape}<text x="${x}" y="${y + 3.5}" text-anchor="middle" fill="${txt}">${esc(label)}</text></g>`;
}

function shell(kind, x0, y0, x1, y1) {
  const pad = 16, X0 = x0 - pad, Y0 = y0 - pad, X1 = x1 + pad, Y1 = y1 + pad, w = X1 - X0, h = Y1 - Y0;
  const st = 'fill="#d9d9d9" stroke="#000" stroke-width="2"';
  switch (kind) {
    case "dsub": { const k = 14; return `<path d="M${X0 - 6} ${Y0} H${X1 + 6} L${X1 - k} ${Y1} H${X0 + k} Z" ${st} stroke-linejoin="round"/>`; }
    case "hdmi": return `<path d="M${X0} ${Y0} H${X1} V${Y1 - 10} L${X1 - 14} ${Y1} H${X0 + 14} L${X0} ${Y1 - 10} Z" ${st}/>`;
    case "dp": return `<path d="M${X0} ${Y0} H${X1} V${Y1 - 14} L${X1 - 14} ${Y1} H${X0} Z" ${st}/>`;
    case "pill": return `<rect x="${X0}" y="${Y0}" width="${w}" height="${h}" rx="${h / 2}" ${st}/>`;
    case "trap": return `<path d="M${X0} ${Y0} H${X1} L${X1 - 10} ${Y1} H${X0 + 10} Z" ${st}/>`;
    case "obd": return `<path d="M${X0} ${Y0} H${X1} V${Y1 - 8} L${X1 - 20} ${Y1} H${X0 + 20} L${X0} ${Y1 - 8} Z" ${st}/>`;
    case "scart": return `<path d="M${X0} ${Y0} H${X1} V${Y1} H${X0 + 20} L${X0} ${Y1 - 20} Z" ${st}/>`;
    case "molex4": return `<path d="M${X0} ${Y0 + 12} L${X0 + 12} ${Y0} H${X1 - 12} L${X1} ${Y0 + 12} V${Y1} H${X0} Z" ${st}/>`;
    default: return `<rect x="${X0}" y="${Y0}" width="${w}" height="${h}" rx="4" ${st}/>`;
  }
}

function svgFor(c) {
  const L = c.layout, map = pinById(c);
  let body = "", W = 640, H = 220;
  if (L.type === "row" || L.type === "rows") {
    const rows = L.type === "row" ? [c.pins.map(p => p[0])] : L.rows;
    const maxN = Math.max(...rows.map(r => r.length));
    const sp = Math.min(46, 560 / maxN), rowGap = 40, r = Math.min(13, sp * 0.42);
    const totalH = (rows.length - 1) * rowGap;
    const cy0 = (H - totalH) / 2;
    const pos = [];
    rows.forEach((row, ri) => {
      // fileiras centralizadas; fileiras desencontradas do mesmo tamanho deslocam meio passo
      const startX = (W - (row.length - 1) * sp) / 2 + (L.stagger && row.length === maxN && ri % 2 ? sp / 2 : 0);
      row.forEach((id, k) => pos.push([startX + k * sp, cy0 + ri * rowGap, map.get(String(id))]));
    });
    const xs = pos.map(p => p[0]), ys = pos.map(p => p[1]);
    if (L.shell === "rj") {
      // plugue RJ: contatos verticais + fios coloridos saindo por baixo
      const x0 = Math.min(...xs) - 26, x1 = Math.max(...xs) + 26;
      body += `<rect x="${x0}" y="40" width="${x1 - x0}" height="90" rx="6" fill="#eef4ff" stroke="#000" stroke-width="2"/><rect x="${(x0 + x1) / 2 - 30}" y="130" width="60" height="18" fill="#cfe0ff" stroke="#000"/>`;
      pos.forEach(([x, , p]) => {
        const wc = p[4] || "#bbb", stripe = String(wc).startsWith("stripe:");
        const col = stripe ? wc.slice(7) : wc;
        body += `<rect x="${x - 7}" y="135" width="14" height="70" fill="${stripe ? "#fff" : col}" stroke="#000"/>` +
          (stripe ? `<rect x="${x - 3}" y="135" width="6" height="70" fill="${col}"/>` : "");
        body += `<g class="pin" data-pin="${esc(p[0])}"><title>${esc(p[0])} — ${esc(p[1])}</title><rect x="${x - 8}" y="48" width="16" height="44" fill="#d4a017" stroke="#000"/><text x="${x}" y="110" text-anchor="middle" fill="#000">${esc(p[0])}</text></g>`;
      });
      H = 215;
    } else {
      body += shell(L.shell, Math.min(...xs) - r, Math.min(...ys) - r, Math.max(...xs) + r, Math.max(...ys) + r);
      pos.forEach(([x, y, p]) => { if (p) body += pinShape(x, y, p, L.square, r); });
    }
  } else if (L.type === "header2") {
    const cols = L.cols, sp = Math.min(30, 600 / cols), r = Math.min(11, sp * 0.4);
    const x0 = (W - (cols - 1) * sp) / 2, y0 = 90;
    body += `<rect x="${x0 - sp / 2 - 4}" y="${y0 - sp / 2 - 4}" width="${cols * sp + 8}" height="${2 * sp + 8}" fill="#222" stroke="#000"/>`;
    c.pins.forEach((p, i) => {
      const col = Math.floor(i / 2), row = i % 2 ? 0 : 1;
      body += pinShape(x0 + col * sp, y0 + row * sp, p, i === 0, r);
    });
    body += `<text x="${x0}" y="${y0 + 2 * sp + 22}" text-anchor="middle" font-size="11">▲ pino 1</text>`;
  } else if (L.type === "circle") {
    const cx = W / 2, cy = H / 2, R = L.r || 70;
    body += `<circle cx="${cx}" cy="${cy}" r="${R + 10}" fill="#9a9a9a" stroke="#000" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#222" stroke="#000"/>`;
    if (L.key === "bottom") body += `<rect x="${cx - 9}" y="${cy + R * 0.62}" width="18" height="${R * 0.4}" fill="#9a9a9a" stroke="#000"/>`;
    else if (L.key) body += `<rect x="${cx - 9}" y="${cy - R - 2}" width="18" height="${R * 0.38}" fill="#9a9a9a" stroke="#000"/>`;
    for (const [id, x, y] of L.pins) body += pinShape(cx + x * R, cy + y * R, map.get(String(id)), false, 13);
  } else if (L.type === "trs") {
    const n = L.parts.length, segW = 90, x0 = 120, y = 110;
    body += `<rect x="${x0 + n * segW}" y="${y - 30}" width="140" height="60" rx="8" fill="#333"/>`;
    c.pins.forEach((p, i) => {
      const x = x0 + i * segW, tip = i === 0;
      body += `<g class="pin" data-pin="${esc(p[0])}"><title>${esc(p[0])} — ${esc(p[1])}</title>` +
        (tip ? `<path d="M${x + segW} ${y - 18} H${x + 30} Q${x} ${y - 18} ${x} ${y} Q${x} ${y + 18} ${x + 30} ${y + 18} H${x + segW} Z" fill="#c9c9c9" stroke="#000"/>`
          : `<rect x="${x}" y="${y - 18}" width="${segW}" height="36" fill="#c9c9c9" stroke="#000"/>`) +
        `<text x="${x + segW / 2}" y="${y + 4}" text-anchor="middle" fill="#000">${esc(p[0])}</text></g>` +
        `<text x="${x + segW / 2}" y="${y + 42}" text-anchor="middle" font-size="11">${esc(L.parts[i])}</text>` +
        (i < n - 1 ? `<rect x="${x + segW - 4}" y="${y - 18}" width="8" height="36" fill="#000"/>` : "");
    });
  } else if (L.type === "rca") {
    const cx = W / 2, cy = H / 2, [center, outer] = c.pins;
    body += `<g class="pin" data-pin="${esc(outer[0])}"><title>Corpo — terra</title><circle cx="${cx}" cy="${cy}" r="70" fill="#c9c9c9" stroke="#000" stroke-width="2"/></g>` +
      `<circle cx="${cx}" cy="${cy}" r="42" fill="#f2c200" stroke="#000"/><circle cx="${cx}" cy="${cy}" r="22" fill="#222"/>` +
      `<g class="pin" data-pin="${esc(center[0])}"><title>Centro — sinal</title><circle cx="${cx}" cy="${cy}" r="9" fill="#c9c9c9" stroke="#000" stroke-width="2"/></g>` +
      `<text x="${cx + 90}" y="${cy - 30}" font-size="12">Corpo = terra</text><text x="${cx + 90}" y="${cy + 4}" font-size="12">Centro = sinal</text>`;
  } else if (L.type === "dvi") {
    const sp = 34, x0 = 140, y0 = 70;
    body += `<path d="M${x0 - 30} ${y0 - 26} H${x0 + 7 * sp + 160} V${y0 + 2 * sp + 26} H${x0 - 10} L${x0 - 30} ${y0 + 2 * sp + 6} Z" fill="#d9d9d9" stroke="#000" stroke-width="2"/>`;
    for (let i = 0; i < 24; i++) body += pinShape(x0 + (i % 8) * sp, y0 + Math.floor(i / 8) * sp, map.get(String(i + 1)), true, 10);
    const cx = x0 + 7 * sp + 80, cy = y0 + sp;
    body += `<rect x="${cx - 34}" y="${cy - 4}" width="68" height="8" fill="#555"/>`;
    [["C1", -20, -22], ["C2", 20, -22], ["C3", -20, 22], ["C4", 20, 22], ["C5", 0, 0]].forEach(([id, dx, dy]) =>
      body += id === "C5" ? `<g class="pin" data-pin="C5"><title>C5 — Analog GND</title><rect x="${cx - 34}" y="${cy - 5}" width="68" height="10" fill="#222" stroke="#000"/><text x="${cx}" y="${cy + 3.5}" text-anchor="middle" fill="#fff">C5</text></g>`
        : pinShape(cx + dx, cy + dy, map.get(id), false, 10));
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)}">${body}</svg>`;
}

// ---------- Tabela ----------
function wireCell(w) {
  if (!w) return "";
  const stripe = String(w).startsWith("stripe:"), col = stripe ? w.slice(7) : w;
  return `<span class="wire" style="background:${stripe ? `repeating-linear-gradient(90deg,#fff 0 5px,${col} 5px 9px)` : col}"></span>`;
}

function show(id) {
  cur = CONNECTORS.find(c => c.id === id) || CONNECTORS[0];
  $("title").textContent = cur.name;
  $("desc").textContent = cur.desc;
  $("view").textContent = "👁 " + (cur.view || "");
  $("svg").innerHTML = svgFor(cur);
  const kinds = [...new Set(cur.pins.map(p => p[3]))];
  $("legend").innerHTML = kinds.map(k => `<span><i style="background:${KIND[k][0]}"></i>${KIND[k][1]}</span>`).join("");
  const hasWire = cur.pins.some(p => p[4]);
  if (hasWire && cur.layout.shell !== "rj") $("legend").innerHTML += `<span class="muted">· no desenho, pinos com fio padrão aparecem na cor do fio</span>`;
  $("pins").innerHTML = cur.pins.map(p => `<tr data-pin="${esc(p[0])}"><td>${esc(p[0])}</td><td><i style="display:inline-block;width:9px;height:9px;background:${KIND[p[3]][0]};border:1px solid #000;margin-right:5px"></i>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${hasWire ? wireCell(p[4]) : ""}</td></tr>`).join("");
  $("note").hidden = !cur.note; $("note").textContent = cur.note ? "💡 " + cur.note : "";
  renderList();
  try { localStorage.setItem("conn-last", cur.id); } catch {}
}

// Clique num pino ↔ linha da tabela
function selectPin(id, scroll) {
  document.querySelectorAll(".pin.sel").forEach(g => g.classList.remove("sel"));
  document.querySelectorAll(`.pin[data-pin="${CSS.escape(id)}"]`).forEach(g => g.classList.add("sel"));
  document.querySelectorAll("#pins tr").forEach(tr => tr.classList.toggle("highlighted", tr.dataset.pin === id));
  if (scroll) document.querySelector(`#pins tr[data-pin="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}
$("svg").addEventListener("click", e => { const g = e.target.closest(".pin"); if (g) selectPin(g.dataset.pin, true); });
$("pins").addEventListener("click", e => {
  const tr = e.target.closest("tr");
  setTimeout(() => { // table98.js já alternou o destaque
    document.querySelectorAll(".pin.sel").forEach(g => g.classList.remove("sel"));
    if (tr.classList.contains("highlighted")) document.querySelectorAll(`.pin[data-pin="${CSS.escape(tr.dataset.pin)}"]`).forEach(g => g.classList.add("sel"));
  });
});

$("q").oninput = renderList;
addEventListener("hashchange", () => show(location.hash.slice(1)));
let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem("conn-last"); } catch {} }
show(start);
</script>
</body></html>
