<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/98/98.css"><link rel="stylesheet" href="/assets/tool98.css">
<title>Gerador de senhas</title></head><body class="stack">
<fieldset><legend>Opções</legend>
  <div class="field-row" style="width:100%"><label for="len">Tamanho:</label><input id="len" type="range" min="8" max="64" value="20" style="flex:1"><b id="lenv" style="width:24px">20</b></div>
  <div class="row" style="margin-top:6px">
    <div class="field-row"><input type="checkbox" id="lower" checked><label for="lower">a-z</label></div>
    <div class="field-row"><input type="checkbox" id="upper" checked><label for="upper">A-Z</label></div>
    <div class="field-row"><input type="checkbox" id="digits" checked><label for="digits">0-9</label></div>
    <div class="field-row"><input type="checkbox" id="symbols" checked><label for="symbols">!@#…</label></div>
  </div>
</fieldset>
<input id="out" type="text" class="mono wide" readonly style="height:28px;font-size:15px">
<div class="row"><button class="default" id="gen">Gerar</button><button id="copy">Copiar</button><span id="st"></span></div>
<p class="muted">Gerado localmente com crypto.getRandomValues — nada sai do seu computador.</p>
<script>
const sets = { lower: "abcdefghijklmnopqrstuvwxyz", upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits: "0123456789", symbols: "!@#$%^&*()-_=+[]{};:,.?/" };
const $ = id => document.getElementById(id);
function rand(n) { const a = new Uint32Array(1); const lim = Math.floor(2 ** 32 / n) * n; do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
function gen() {
  const active = Object.keys(sets).filter(k => $(k).checked);
  if (!active.length) { $("st").textContent = "Selecione ao menos um conjunto."; return; }
  const len = +$("len").value, pool = active.map(k => sets[k]).join("");
  const chars = active.map(k => sets[k][rand(sets[k].length)]);
  while (chars.length < len) chars.push(pool[rand(pool.length)]);
  for (let i = chars.length - 1; i > 0; i--) { const j = rand(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  $("out").value = chars.join(""); $("st").textContent = "";
}
$("len").oninput = e => { $("lenv").textContent = e.target.value; gen(); };
document.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = gen);
$("gen").onclick = gen;
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("out").value); $("st").textContent = "Copiado!"; } catch { $("out").select(); } };
gen();
</script></body></html>
