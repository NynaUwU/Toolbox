<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/vendor/98/98.css"><link rel="stylesheet" href="/assets/tool98.css">
<title>Formatador de JSON</title>
<style>body{display:flex;flex-direction:column;gap:8px} textarea{flex:1;min-height:200px;resize:none}</style></head><body>
<textarea id="txt" class="mono wide" spellcheck="false" placeholder='{"exemplo": [1, 2, 3]}'></textarea>
<div class="row">
  <button class="default" id="fmt">Formatar</button><button id="min">Minificar</button>
  <select id="ind"><option value="2">2 espaços</option><option value="4">4 espaços</option><option value="tab">Tab</option></select>
  <button id="copy">Copiar</button>
  <span id="st"></span>
</div>
<script>
const $ = id => document.getElementById(id);
function run(pretty) {
  try {
    const v = JSON.parse($("txt").value);
    const ind = $("ind").value === "tab" ? "\t" : +$("ind").value;
    $("txt").value = pretty ? JSON.stringify(v, null, ind) : JSON.stringify(v);
    $("st").className = "ok"; $("st").textContent = "✔ JSON válido";
  } catch (e) { $("st").className = "error"; $("st").textContent = "✖ " + e.message; }
}
$("fmt").onclick = () => run(true);
$("min").onclick = () => run(false);
$("copy").onclick = () => navigator.clipboard.writeText($("txt").value).then(() => $("st").textContent = "Copiado!");
</script></body></html>
