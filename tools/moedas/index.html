<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de moedas</title>
<link rel="stylesheet" href="/vendor/98/98.css"><link rel="stylesheet" href="/assets/tool98.css"><script src="/assets/remote.js"></script><script src="/assets/table98.js" defer></script>
<style> #fav td:last-child { text-align: right; } </style>
</head><body>
<div class="stack">
  <fieldset>
    <legend>Converter</legend>
    <div class="row">
      <input id="val" type="number" step="any" value="100" class="grow big" style="height:30px" aria-label="Valor">
      <select id="from" class="grow" aria-label="De"></select>
      <button id="swap" title="Inverter">⇄</button>
      <select id="to" class="grow" aria-label="Para"></select>
    </div>
    <div class="sunken-panel" style="margin-top:8px"><div class="big" id="result">Carregando cotações…</div><div class="muted" id="rate"></div></div>
  </fieldset>
  <fieldset>
    <legend>Valor em outras moedas</legend>
    <div class="sunken-panel" style="max-height:220px;overflow:auto"><table class="interactive"><tbody id="fav"></tbody></table></div>
  </fieldset>
  <div class="row"><span class="muted grow" id="src"></span><button id="refresh">Atualizar cotação</button></div>
</div>
<script>
const NAMES = { BRL: "Real", USD: "Dólar americano", EUR: "Euro", GBP: "Libra esterlina", JPY: "Iene", CNY: "Yuan", ARS: "Peso argentino",
  CLP: "Peso chileno", UYU: "Peso uruguaio", PYG: "Guarani", MXN: "Peso mexicano", CAD: "Dólar canadense", AUD: "Dólar australiano",
  CHF: "Franco suíço", BTC: "Bitcoin", KRW: "Won", INR: "Rupia indiana", RUB: "Rublo", COP: "Peso colombiano", PEN: "Sol peruano",
  BOB: "Boliviano", SEK: "Coroa sueca", NOK: "Coroa norueguesa", DKK: "Coroa dinamarquesa", ZAR: "Rand", TRY: "Lira turca", HKD: "Dólar de HK", NZD: "Dólar neozelandês" };
const FAVS = ["BRL", "USD", "EUR", "GBP", "ARS", "JPY", "CNY", "CAD", "CHF", "CLP", "UYU", "PYG"];
const $ = id => document.getElementById(id);
let rates = null;
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

const money = (v, c) => {
  try { return v.toLocaleString("pt-BR", { style: "currency", currency: c, maximumFractionDigits: v < 1 ? 6 : 2 }); }
  catch { return `${v.toLocaleString("pt-BR", { maximumFractionDigits: 4 })} ${c}`; }
};

async function load(refresh) {
  $("result").textContent = "Carregando cotações…";
  try {
    const r = await fetch("/api/currency" + (refresh ? "?refresh=1" : ""));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    rates = d.rates;
    const codes = Object.keys(rates).sort((a, b) => (FAVS.indexOf(a) + 1 || 99) - (FAVS.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const opts = codes.map(c => `<option value="${c}">${c}${NAMES[c] ? " — " + NAMES[c] : ""}</option>`).join("");
    const keepFrom = $("from").value || store.get("fx-from") || "USD", keepTo = $("to").value || store.get("fx-to") || "BRL";
    $("from").innerHTML = $("to").innerHTML = opts;
    $("from").value = keepFrom; $("to").value = keepTo;
    $("src").textContent = `Fonte: ${d.source} · ${new Date(d.fetched).toLocaleString("pt-BR")}${d.stale ? " (offline — última cotação salva)" : ""}`;
    calc();
  } catch (e) {
    $("result").innerHTML = `<span class="error">✖ ${e.message || "Falha ao obter cotações"}</span>`;
  }
}
function calc() {
  if (!rates) return;
  const v = parseFloat($("val").value) || 0, a = $("from").value, b = $("to").value;
  const conv = (x, from, to) => x / rates[from] * rates[to];
  store.set("fx-from", a); store.set("fx-to", b);
  $("result").textContent = `${money(v, a)} = ${money(conv(v, a, b), b)}`;
  $("rate").textContent = `1 ${a} = ${conv(1, a, b).toLocaleString("pt-BR", { maximumFractionDigits: 6 })} ${b} · 1 ${b} = ${conv(1, b, a).toLocaleString("pt-BR", { maximumFractionDigits: 6 })} ${a}`;
  $("fav").innerHTML = FAVS.filter(c => c !== a && rates[c]).map(c => `<tr><td>${c} — ${NAMES[c] || ""}</td><td class="mono">${money(conv(v, a, c), c)}</td></tr>`).join("");
}
$("val").oninput = $("from").onchange = $("to").onchange = calc;
$("swap").onclick = () => { [$("from").value, $("to").value] = [$("to").value, $("from").value]; calc(); };
$("refresh").onclick = () => load(true);
load();
</script>
</body></html>
