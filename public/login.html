<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox — senha</title>
<link rel="stylesheet" href="/vendor/98/98.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #3a8c8c; font-family: "Pixelated MS Sans Serif", Arial, sans-serif; }
  .window { width: min(340px, 92vw); }
  .window-body { display: flex; flex-direction: column; gap: 8px; }
  input { width: 100%; }
  .err { color: #a00000; min-height: 1.2em; }
</style>
</head><body>
<form class="window" id="f">
  <div class="title-bar"><div class="title-bar-text">🧰 Toolbox — acesso pela rede</div></div>
  <div class="window-body">
    <p>Esta Toolbox está protegida. Digite a senha:</p>
    <input type="password" id="pw" autofocus autocomplete="current-password" aria-label="Senha">
    <p class="err" id="err"></p>
    <div style="text-align:right"><button class="default" type="submit">Entrar</button></div>
  </div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (!r.ok) { document.getElementById("err").textContent = "Senha incorreta."; return; }
  const next = new URLSearchParams(location.search).get("next") || "/";
  location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
};
</script>
</body></html>
